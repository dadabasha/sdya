<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1>Auction Entries</h1><a class="btn" href="/auctions/new">+ New Auction</a></div><div class="cards"><div class="card"><b>Paid Auction Amount</b><h2 th:text="${'₹ '+paidTotal}">₹0</h2></div><div class="card"><b>Due Auction Amount</b><h2 th:text="${'₹ '+dueTotal}">₹0</h2></div></div><div class="card tablewrap"><table><tr><th>Date</th><th>Item</th><th>Bidder</th><th>Phone</th><th>Event</th><th>Status</th><th>Amount</th><th>Action</th></tr><tr th:each="a:${auctions}"><td th:text="${#temporals.format(a.auctionDate,'dd-MM-yyyy HH:mm')}"></td><td th:text="${a.itemName}"></td><td th:text="${a.bidderName}"></td><td th:text="${a.bidderPhone}"></td><td th:text="${a.event.name}"></td><td><span class="badge" th:text="${a.status}"></span></td><td th:text="${a.winningAmount}"></td><td><a th:href="@{'/auctions/'+${a.id}+'/edit'}">Edit</a></td></tr></table></div></section></div>
