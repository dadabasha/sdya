<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1 th:text="${auction.id==null?'Auction Entry':'Update Auction'}">Auction Entry</h1><a class="btn secondary" href="/auctions">Auction List</a></div><form class="card" th:action="@{/auctions}" th:object="${auction}" method="post"><input type="hidden" th:field="*{id}"><div class="split"><div><label>Item Name</label><input th:field="*{itemName}" required><label>Item Description</label><textarea th:field="*{itemDescription}" placeholder="Example: Coconut auction, prasadam item, special pooja item"></textarea><label>Event</label><select th:field="*{event}" required><option value="">Select Event</option><option th:each="e:${events}" th:value="${e.id}" th:text="${e.name}"></option></select><label>Auction Date & Time</label><input type="datetime-local" th:field="*{auctionDate}" required></div><div><label>Bidder Name</label><input th:field="*{bidderName}" required><label>Bidder Phone</label><input th:field="*{bidderPhone}"><label>Bidder Address</label><textarea th:field="*{bidderAddress}"></textarea><label>Winning Amount</label><input type="number" step="0.01" th:field="*{winningAmount}" required><label>Status</label><select th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select><label>Payment Mode</label><select th:field="*{paymentMode}"><option th:each="m:${modes}" th:value="${m}" th:text="${m}"></option></select><label>Reference No</label><input th:field="*{referenceNo}"><label>Notes</label><textarea th:field="*{notes}"></textarea></div></div><button th:text="${auction.id==null?'Save Auction':'Update Auction'}">Save Auction</button></form></section></div>
