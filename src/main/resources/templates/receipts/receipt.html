<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1>Receipt</h1><div class="actions"><button onclick="window.print()">Browser Print</button><button th:attr="onclick=|bluetoothPrint(document.getElementById('printText').textContent)|">Bluetooth Print</button><a class="btn secondary" href="/donations/new">New Donation</a></div></div><div class="receipt"><h2>SDYA Festival Fund</h2><hr><p><b>Receipt No:</b> <span th:text="${donation.receiptNo}"></span></p><p><b>Donor:</b> <span th:text="${donation.donorName}"></span></p><p><b>Phone:</b> <span th:text="${donation.phone}"></span></p><p><b>Event:</b> <span th:text="${donation.event.name}"></span></p><p><b>Amount:</b> ₹ <b th:text="${donation.amount}"></b></p><p><b>Status:</b> <span th:text="${donation.paymentStatus}"></span></p><p><b>Payment:</b> <span th:text="${donation.paymentMode}"></span></p><p><b>Volunteer:</b> <span th:text="${donation.volunteerName}"></span></p><p><b>Volunteer Work:</b> <span th:text="${donation.volunteerWork}"></span></p><p><b>Date:</b> <span th:text="${#temporals.format(donation.donatedAt,'dd-MM-yyyy HH:mm')}"></span></p><hr><p style="text-align:center">Thank you for your contribution.</p></div><pre style="display:none" id="printText" th:text="${printText}"></pre></section></div>
