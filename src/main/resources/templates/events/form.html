<div th:replace="~{layout :: shell(~{::section})}"><section><h1>Event Setup</h1><form class="card" th:action="@{/events}" th:object="${event}" method="post"><input type="hidden" th:field="*{id}"><label>Name</label><input th:field="*{name}" required><label>Type</label><select th:field="*{type}"><option th:each="t:${types}" th:value="${t}" th:text="${t}"></option></select><label>Start Date</label><input type="date" th:field="*{startDate}"><label>End Date</label><input type="date" th:field="*{endDate}"><label>Target Amount</label><input type="number" step="0.01" th:field="*{targetAmount}"><label>Description</label><textarea th:field="*{description}"></textarea><label><input type="checkbox" th:field="*{active}" style="width:auto"> Active</label><br><button>Save Event</button></form></section></div>
