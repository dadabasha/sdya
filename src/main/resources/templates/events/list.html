<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1>Festival / Public Events</h1><a class="btn" href="/events/new">+ New Event</a></div><div class="card"><table><tr><th>Name</th><th>Type</th><th>Dates</th><th>Target</th><th>Status</th><th>Edit</th></tr><tr th:each="e:${events}"><td th:text="${e.name}"></td><td th:text="${e.type}"></td><td th:text="${e.startDate+' to '+e.endDate}"></td><td th:text="${e.targetAmount}"></td><td th:text="${e.active?'Active':'Closed'}"></td><td><a class="btn secondary" th:href="@{/events/{id}/edit(id=${e.id})}">Edit</a></td></tr></table></div></section></div>
