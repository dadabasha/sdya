<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1>Users & Privileges</h1><a class="btn" href="/users/new">+ New User</a></div><div class="card tablewrap"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Entry Screens</th><th>Reports</th><th>Action</th></tr><tr th:each="u:${users}"><td th:text="${u.fullName}"></td><td th:text="${u.username}"></td><td th:text="${u.role}"></td><td th:text="${u.enabled?'Active':'Disabled'}"></td><td><span th:if="${u.canDonation}">Donation </span><span th:if="${u.canExpense}">Expense </span><span th:if="${u.canAuction}">Auction </span><span th:if="${u.canTreasurer}">Treasurer </span><span th:if="${u.canEvents}">Events </span><span th:if="${u.canUsers}">Users</span></td><td><span th:if="${u.canReports}">All </span><span th:if="${u.canDonationReport}">Donation </span><span th:if="${u.canDonationDueReport}">Due </span><span th:if="${u.canUpiReport}">UPI </span><span th:if="${u.canExpenseReport}">Expense </span><span th:if="${u.canCashPaidReport}">CashPaid </span><span th:if="${u.canCashInHandReport}">CashInHand </span><span th:if="${u.canAuctionReport}">Auction</span></td><td><a th:href="@{'/users/'+${u.id}+'/edit'}">Edit</a></td></tr></table></div></section></div>
