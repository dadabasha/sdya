<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1 th:text="${user.id==null?'Create User':'Update User Privileges'}">Create User</h1><a class="btn secondary" href="/users">Back</a></div><form class="card" th:action="@{/users}" th:object="${user}" method="post"><input type="hidden" th:field="*{id}"><div class="split"><div><label>Full Name</label><input th:field="*{fullName}" required><label>Username</label><input th:field="*{username}" required><label>Password <small th:if="${user.id!=null}">(leave blank to keep old password)</small></label><input type="password" th:field="*{password}" th:required="${user.id==null}"><label>Email</label><input th:field="*{email}"><label>Phone</label><input th:field="*{phone}"><label>Role</label><select th:field="*{role}"><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select><label><input type="checkbox" th:field="*{enabled}" style="width:auto"> Active</label></div><div><h2>Entry Screen Privileges</h2><p class="muted">Only ticked screens will display in this user's menu.</p><label><input type="checkbox" th:field="*{canDonation}" style="width:auto"> Donation Entry</label><label><input type="checkbox" th:field="*{canExpense}" style="width:auto"> Expense Entry</label><label><input type="checkbox" th:field="*{canAuction}" style="width:auto"> Auction Entry</label><label><input type="checkbox" th:field="*{canTreasurer}" style="width:auto"> Treasurer Screen</label><label><input type="checkbox" th:field="*{canEvents}" style="width:auto"> Events Setup</label><label><input type="checkbox" th:field="*{canUsers}" style="width:auto"> User Creation / Privileges</label></div></div><div class="card" style="margin-top:18px"><h2>Report & Dashboard Privileges</h2><p class="muted">Dashboard cards and Reports menu are shown based on these privileges. Admin role automatically gets all reports.</p><div class="split"><div><label><input type="checkbox" th:field="*{canReports}" style="width:auto"> All Reports</label><label><input type="checkbox" th:field="*{canDonationReport}" style="width:auto"> Donation Report</label><label><input type="checkbox" th:field="*{canDonationDueReport}" style="width:auto"> Donation Due Report</label><label><input type="checkbox" th:field="*{canUpiReport}" style="width:auto"> UPI Amount Report</label><label><input type="checkbox" th:field="*{canAuctionReport}" style="width:auto"> Auction Report</label></div><div><label><input type="checkbox" th:field="*{canExpenseReport}" style="width:auto"> Expense Report</label><label><input type="checkbox" th:field="*{canCashPaidReport}" style="width:auto"> Cash Paid / Cash Collection Report</label><label><input type="checkbox" th:field="*{canCashInHandReport}" style="width:auto"> Cash In Hand Report</label></div></div></div><button>Save User</button></form></section></div>
