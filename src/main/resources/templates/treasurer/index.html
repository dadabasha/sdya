<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1>Treasurer Screen</h1><button onclick="window.print()">Print Summary</button></div><div class="cards"><div class="card"><b>Last Year Amount in Hand</b><h2 th:text="${'₹ '+settings.lastYearAmountInHand}"></h2></div><div class="card"><b>This Year Total Collected</b><h2 th:text="${'₹ '+totalCollected}"></h2></div><div class="card"><b>This Year Expense</b><h2 th:text="${'₹ '+expense}"></h2></div><div class="card"><b>Current Year In Hand</b><h2 th:text="${'₹ '+currentHand}"></h2></div><div class="card"><b>Total Amount In Hand</b><h2 th:text="${'₹ '+totalInHand}"></h2></div><div class="card"><b>Total Due</b><h2 th:text="${'₹ '+totalDue}"></h2></div></div><div class="cards"><div class="card"><b>Donation Collected</b><h2 th:text="${'₹ '+donation}"></h2></div><div class="card"><b>Auction Collected</b><h2 th:text="${'₹ '+auction}"></h2></div><div class="card"><b>Cash Collected</b><h2 th:text="${'₹ '+cashCollection}"></h2></div><div class="card"><b>UPI Collected</b><h2 th:text="${'₹ '+upiCollection}"></h2></div></div><form class="card" th:action="@{/treasurer/settings}" th:object="${settings}" method="post"><h2>Opening Balance Setting</h2><label>Financial Year</label><input th:field="*{financialYear}"><label>Last Year Amount Left in Hand</label><input type="number" step="0.01" th:field="*{lastYearAmountInHand}"><label>Notes</label><textarea th:field="*{notes}"></textarea><button>Update Opening Balance</button></form></section></div>
