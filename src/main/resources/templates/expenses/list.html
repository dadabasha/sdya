<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1>Expenses</h1><a class="btn" href="/expenses/new">New Expense</a></div><div class="card tablewrap"><table><tr><th>Date</th><th>Title</th><th>Category</th><th>Event</th><th>Mode</th><th>Ref No</th><th>Amount</th><th>Action</th></tr><tr th:each="e:${expenses}"><td th:text="${#temporals.format(e.expenseDate,'dd-MM-yyyy')}"></td><td th:text="${e.title}"></td><td th:text="${e.category}"></td><td th:text="${e.event.name}"></td><td th:text="${e.paymentMode}"></td><td th:text="${e.referenceNo}"></td><td th:text="${e.amount}"></td><td><a th:href="@{'/expenses/'+${e.id}+'/edit'}">Edit</a></td></tr></table></div></section></div>
