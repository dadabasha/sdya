<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1 th:text="${expense.id==null?'Expense Entry':'Update Expense'}">Expense Entry</h1><a class="btn secondary" href="/expenses">List</a></div><form class="card" th:action="@{/expenses}" th:object="${expense}" method="post"><input type="hidden" th:field="*{id}"><div class="split"><div><label>Title</label><input th:field="*{title}" required><label>Category</label><input th:field="*{category}" required><label>Amount</label><input type="number" step="0.01" th:field="*{amount}" required><label>Payment Mode</label><select th:field="*{paymentMode}"><option th:each="m:${modes}" th:value="${m}" th:text="${m}"></option></select><label>Reference No</label><input th:field="*{referenceNo}"><label>Expense Date</label><input type="date" th:field="*{expenseDate}" required></div><div><label>Event</label><select th:field="*{event}" required><option value="">Select</option><option th:each="e:${events}" th:value="${e.id}" th:text="${e.name}"></option></select><label>Vendor Name</label><input th:field="*{vendorName}"><label>Bill No</label><input th:field="*{billNo}"><label>Notes</label><textarea th:field="*{notes}"></textarea></div></div><button th:text="${expense.id==null?'Save Expense':'Update Expense'}">Save</button></form></section></div>
