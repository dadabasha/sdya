<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1>Donations</h1><a class="btn" href="/donations/new">New Donation</a></div><div class="card tablewrap"><table><tr><th>Receipt</th><th>Date</th><th>Donor</th><th>Event</th><th>Status</th><th>Mode</th><th>Volunteer Work</th><th>Amount</th><th>Action</th></tr><tr th:each="d:${donations}"><td th:text="${d.receiptNo}"></td><td th:text="${#temporals.format(d.donatedAt,'dd-MM-yyyy HH:mm')}"></td><td th:text="${d.donorName}"></td><td th:text="${d.event.name}"></td><td><span class="badge" th:text="${d.paymentStatus}"></span></td><td th:text="${d.paymentMode}"></td><td><b th:text="${d.volunteerName}"></b><br><small th:text="${d.volunteerWork}"></small></td><td th:text="${d.amount}"></td><td><a th:href="@{'/receipts/'+${d.receiptNo}}">Print</a> | <a th:href="@{'/donations/'+${d.id}+'/edit'}">Edit</a></td></tr></table></div></section></div>
