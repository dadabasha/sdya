<div th:replace="~{layout :: shell(~{::section})}"><section><div class="top"><h1 th:text="${donation.id==null?'Donation Entry':'Update Donation'}">Donation Entry</h1><a class="btn secondary" href="/donations">List</a></div><form class="card" th:action="@{/donations}" th:object="${donation}" method="post"><input type="hidden" th:field="*{id}"><div class="split"><div><label>Donor Name</label><input th:field="*{donorName}" required><label>Phone</label><input th:field="*{phone}"><label>Address</label><textarea th:field="*{address}"></textarea><label>Amount</label><input type="number" step="0.01" th:field="*{amount}" required><label>Event</label><select th:field="*{event}" required><option value="">Select</option><option th:each="e:${events}" th:value="${e.id}" th:text="${e.name}"></option></select></div><div><label>Payment Mode</label><select th:field="*{paymentMode}"><option th:each="m:${modes}" th:value="${m}" th:text="${m}"></option></select><label>Reference No / UPI ID</label><input th:field="*{referenceNo}"><label>Payment Status</label><select th:field="*{paymentStatus}"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select><label>Promised Date for Due</label><input type="date" th:field="*{promisedDate}"><label>Volunteer Name</label><input th:field="*{volunteerName}" placeholder="Volunteer who collected / worked"><label>Volunteer Work</label><textarea th:field="*{volunteerWork}" placeholder="Example: Street collection, receipt writing, temple counter, UPI follow-up"></textarea><label>Notes</label><textarea th:field="*{notes}"></textarea></div></div><button th:text="${donation.id==null?'Save & Print Receipt':'Update & Print Receipt'}">Save</button></form></section></div>
